[project]
name = "sft-post-training"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "accelerate",
    "datasets",
    "mlflow",
    "pandas",
    "torch",
    "trl>=1.18.2",
    "unsloth",
]

[project.scripts]
sft_post_training = "sft_post_training:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "sft_post_training"
